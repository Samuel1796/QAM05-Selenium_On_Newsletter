name: Selenium CI Pipeline

on:
  push:
    branches: [ master ]
  repository_dispatch:
    types: [ newsletter-update ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # 🔥 prevents matrix cancellation
      matrix:
        java-version: [ '11', '17' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Install Dependencies
        run: mvn clean install -DskipTests

      # 🔑 Run tests and capture exit code
      - name: Run Selenium Tests
        id: selenium_tests
        continue-on-error: true
        run: |
          mvn test -B -V
          if [ $? -ne 0 ]; then
            echo "TEST_FAILED=true" >> $GITHUB_ENV
          else
            echo "TEST_FAILED=false" >> $GITHUB_ENV
          fi

      # 🔍 Check report directory
      - name: Check Test Reports
        id: check_reports
        continue-on-error: true
        run: |
          if [ -d target/surefire-reports ]; then
            echo "REPORTS_EXIST=true" >> $GITHUB_ENV
          else
            echo "REPORTS_EXIST=false" >> $GITHUB_ENV
          fi

      # 📦 Upload reports only if they exist
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-reports-java-${{ matrix.java-version }}
          path: target/surefire-reports
          retention-days: 30

      # 📋 Generate Test Summary
      - name: Generate Test Summary
        if: always()
        continue-on-error: true
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d target/surefire-reports ]; then
            echo "### Test Reports Generated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Reports Location:** \`target/surefire-reports/\`" >> $GITHUB_STEP_SUMMARY
            if [ -f target/surefire-reports/index.html ]; then
              echo "- HTML Report available" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Java Version:** ${{ matrix.java-version }}" >> $GITHUB_STEP_SUMMARY

      # 📸 Upload screenshots only if they exist
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-screenshots-java-${{ matrix.java-version }}
          path: |
            target/**/*.png
            screenshots/**/*.png
          retention-days: 30

      # ✅ Slack PASS
      - name: Slack Notification - Success
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "username": "myGitHubActions",
              "icon_emoji": ":robot_face:",
              "text": "✅ Selenium Tests PASSED",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "✅ Selenium Tests Passed", "emoji": true }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Java:* ${{ matrix.java-version }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  }
                }
              ]
            }

      # ❌ Slack FAIL
      - name: Slack Notification - Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "username": "myGitHubActions",
              "icon_emoji": ":robot_face:",
              "text": "❌ Selenium Tests FAILED",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "❌ Selenium Tests Failed", "emoji": true }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Java:* ${{ matrix.java-version }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n\nSome tests failed. Reports and screenshots (if any) are attached."
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Workflow Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View details>"
                  }
                }
              ]
            }