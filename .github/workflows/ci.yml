name: Selenium CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Optional: custom trigger for external systems (kept for flexibility)
  repository_dispatch:
    types: [ newsletter-update ]
  # Manual trigger for ad‑hoc runs
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # Run Chrome in headless mode on CI runners.
      CI: "true"
      HEADLESS: "true"

    strategy:
      fail-fast: false
      matrix:
        java-version: [ "11", "17" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Install Dependencies
        run: mvn clean install -DskipTests

      - name: Run Selenium Tests
        id: selenium_tests
        continue-on-error: true
        run: |
          set +e
          mvn test -B -V
          TEST_EXIT=$?
          set -e
          echo "TEST_EXIT_CODE=$TEST_EXIT" >> $GITHUB_ENV

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-reports-java-${{ matrix.java-version }}
          path: target/surefire-reports
          retention-days: 30

      - name: Generate Test Summary
        if: always()
        continue-on-error: true
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Java Version:** ${{ matrix.java-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Exit Code:** $TEST_EXIT_CODE" >> $GITHUB_STEP_SUMMARY

          if [ -d target/surefire-reports ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Test Reports Generated" >> $GITHUB_STEP_SUMMARY
            echo "**Reports Location:** \`target/surefire-reports/\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No surefire reports directory found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-screenshots-java-${{ matrix.java-version }}
          path: |
            target/**/*.png
            screenshots/**/*.png
          retention-days: 30

      - name: Parse Test Results
        if: always()
        continue-on-error: true
        run: |
          set +e
          sudo apt-get update -qq > /dev/null 2>&1
          # xmlstarlet is used to parse TestNG/JUnit XML reports; jq is used to safely construct Slack JSON.
          sudo apt-get install -y -qq xmlstarlet jq > /dev/null 2>&1
          set -e

          REPORT_DIR="target/surefire-reports"
          TESTNG_REPORT="${REPORT_DIR}/testng-results.xml"

          TOTAL=0
          PASSED=0
          FAILED=0
          SKIPPED=0

          > /tmp/test_results.txt
          > /tmp/failed_tests.txt

          if [ -f "$TESTNG_REPORT" ]; then
            # TestNG is the primary test framework used in this repository.
            TOTAL=$(xmlstarlet sel -t -v "/testng-results/@total" "$TESTNG_REPORT" 2>/dev/null || echo 0)
            PASSED=$(xmlstarlet sel -t -v "/testng-results/@passed" "$TESTNG_REPORT" 2>/dev/null || echo 0)
            FAILED=$(xmlstarlet sel -t -v "/testng-results/@failed" "$TESTNG_REPORT" 2>/dev/null || echo 0)
            SKIPPED=$(xmlstarlet sel -t -v "/testng-results/@skipped" "$TESTNG_REPORT" 2>/dev/null || echo 0)

            # List failing test methods (ignore configuration methods).
            xmlstarlet sel -t \
              -m "//test-method[@status='FAIL' and (not(@is-config) or @is-config='false')]" \
              -v "concat(@class, '#', @name)" -n \
              "$TESTNG_REPORT" 2>/dev/null | sort -u > /tmp/failed_tests.txt || true

            if [ "$FAILED" -gt 0 ]; then
              head -20 /tmp/failed_tests.txt | while read -r t; do
                [ -z "$t" ] && continue
                echo "FAIL $t" >> /tmp/test_results.txt
              done
              if [ "$FAILED" -gt 20 ]; then
                echo "... and $((FAILED - 20)) more failing tests" >> /tmp/test_results.txt
              fi
            else
              # If all tests passed, show a short sample of passing tests for visibility.
              xmlstarlet sel -t \
                -m "//test-method[@status='PASS' and (not(@is-config) or @is-config='false')]" \
                -v "concat(@class, '#', @name)" -n \
                "$TESTNG_REPORT" 2>/dev/null | sort -u | head -20 | while read -r t; do
                  [ -z "$t" ] && continue
                  echo "PASS $t" >> /tmp/test_results.txt
                done || true
              if [ -s /tmp/test_results.txt ]; then
                echo "... (showing up to 20 passing tests)" >> /tmp/test_results.txt
              else
                echo "PASS All tests passed." >> /tmp/test_results.txt
              fi
            fi
          else
            # Fallback for JUnit XML (in case the project switches frameworks or report format changes).
            if [ -d "$REPORT_DIR" ]; then
              xmlstarlet sel -t \
                -m "//testcase" \
                -v "@classname" -o "#" -v "@name" -o "|" \
                -v "name((failure|error)[1])" \
                -n \
                "$REPORT_DIR"/TEST-*.xml 2>/dev/null > /tmp/junit_cases.txt || true
            fi

            TOTAL=$(awk -F'|' 'NF{c++} END{print c+0}' /tmp/junit_cases.txt 2>/dev/null || echo 0)
            FAILED=$(awk -F'|' 'tolower($2)=="failure" || tolower($2)=="error"{c++} END{print c+0}' /tmp/junit_cases.txt 2>/dev/null || echo 0)
            PASSED=$((TOTAL - FAILED))
            SKIPPED=0

            if [ "$FAILED" -gt 0 ]; then
              awk -F'|' 'tolower($2)=="failure" || tolower($2)=="error"{print "FAIL "$1}' /tmp/junit_cases.txt | sort -u | head -20 > /tmp/test_results.txt || true
            else
              awk -F'|' 'NF{print "PASS "$1}' /tmp/junit_cases.txt | sort -u | head -20 > /tmp/test_results.txt || true
              echo "... (showing up to 20 passing tests)" >> /tmp/test_results.txt
            fi
          fi

          RESULTS=$(cat /tmp/test_results.txt)
          if [ -z "$RESULTS" ]; then
            RESULTS="No parsed test case results found."
          fi

          echo "TEST_RESULTS<<EOFMARKER" >> $GITHUB_ENV
          echo "$RESULTS" >> $GITHUB_ENV
          echo "EOFMARKER" >> $GITHUB_ENV
          echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV
          echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
          echo "FAILED_TESTS=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED_TESTS=$SKIPPED" >> $GITHUB_ENV

          # Determine pipeline status:
          # - If any tests failed -> fail
          # - Else if Maven returned a non-zero code -> fail (build/runtime error)
          # - Else -> success
          if [ "$FAILED" -gt 0 ]; then
            echo "TEST_FAILED=true" >> $GITHUB_ENV
            echo "FAIL_REASON=test_failures" >> $GITHUB_ENV
          elif [ "${TEST_EXIT_CODE:-0}" -ne 0 ]; then
            echo "TEST_FAILED=true" >> $GITHUB_ENV
            echo "FAIL_REASON=build_error" >> $GITHUB_ENV
          else
            echo "TEST_FAILED=false" >> $GITHUB_ENV
            echo "FAIL_REASON=none" >> $GITHUB_ENV
          fi

      - name: Format Notification Payload
        if: always()
        run: |
          FORMATTED=$(echo "$TEST_RESULTS" | sed 's/^PASS /:white_check_mark: /g' | sed 's/^FAIL /:x: /g')
          echo "FORMATTED_RESULTS<<EOFMARKER" >> $GITHUB_ENV
          echo "$FORMATTED" >> $GITHUB_ENV
          echo "EOFMARKER" >> $GITHUB_ENV

          SUMMARY="Passed: ${PASSED_TESTS} | Failed: ${FAILED_TESTS} | Skipped: ${SKIPPED_TESTS} | Total: ${TOTAL_TESTS}"
          echo "SUMMARY_LINE=$SUMMARY" >> $GITHUB_ENV

          if [ "${TEST_FAILED}" = "true" ] && [ "${FAIL_REASON}" = "build_error" ]; then
            echo "STATUS_LINE=:x: Build error (mvn exit code ${TEST_EXIT_CODE}). ${SUMMARY}" >> $GITHUB_ENV
          elif [ "${TEST_FAILED}" = "true" ]; then
            echo "STATUS_LINE=:x: Test failures. ${SUMMARY}" >> $GITHUB_ENV
          else
            echo "STATUS_LINE=:white_check_mark: Tests passed. ${SUMMARY}" >> $GITHUB_ENV
          fi

      - name: Slack Notification - Success
        if: always() && env.TEST_FAILED == 'false' && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          PAYLOAD=$(jq -n \
            --arg text ":white_check_mark: Selenium Tests PASSED" \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg java "${{ matrix.java-version }}" \
            --arg sha "$SHORT_SHA" \
            --arg status "$STATUS_LINE" \
            --arg results "$FORMATTED_RESULTS" \
            --arg url "$RUN_URL" \
            '{
              text: $text,
              blocks: [
                { type: "header", text: { type: "plain_text", text: "Selenium Tests PASSED" } },
                { type: "section", text: { type: "mrkdwn", text: ("*Repo:* " + $repo + "\n*Branch:* " + $branch + "\n*Java:* " + $java + "\n*Commit:* `" + $sha + "`") } },
                { type: "section", text: { type: "mrkdwn", text: ("*Status:* " + $status) } },
                { type: "section", text: { type: "mrkdwn", text: ("*Sample results (first lines):*\n```" + $results + "```") } },
                { type: "section", text: { type: "mrkdwn", text: ("<" + $url + "|View workflow run & artifacts>") } }
              ]
            }')
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$PAYLOAD" > /dev/null

      - name: Slack Notification - Failure
        if: always() && env.TEST_FAILED == 'true' && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"

          # Build formatted output block with all test result details
          FORMATTED_BLOCK="TEST_EXIT_CODE: ${TEST_EXIT_CODE:-0}
          TEST_RESULTS: ${TEST_RESULTS}
          TOTAL_TESTS: ${TOTAL_TESTS}
          PASSED_TESTS: ${PASSED_TESTS}
          FAILED_TESTS: ${FAILED_TESTS}
          SKIPPED_TESTS: ${SKIPPED_TESTS}
          TEST_FAILED: ${TEST_FAILED}
          FAIL_REASON: ${FAIL_REASON}
          FORMATTED_RESULTS: ${FORMATTED_RESULTS}
          SUMMARY_LINE: ${SUMMARY_LINE}
          STATUS_LINE: ${STATUS_LINE}"
          FORMATTED_BLOCK=$(echo "$FORMATTED_BLOCK" | sed 's/^          //')

          PAYLOAD=$(jq -n \
            --arg text ":x: One or more Selenium tests failed." \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg java "${{ matrix.java-version }}" \
            --arg sha "$SHORT_SHA" \
            --arg status "$STATUS_LINE" \
            --arg results "$FORMATTED_RESULTS" \
            --arg block "$FORMATTED_BLOCK" \
            --arg url "$RUN_URL" \
            '{
              text: $text,
              blocks: [
                { type: "header", text: { type: "plain_text", text: "One or more Selenium tests failed." } },
                { type: "section", text: { type: "mrkdwn", text: ("*Repo:* " + $repo + "\n*Branch:* " + $branch + "\n*Java:* " + $java + "\n*Commit:* `" + $sha + "`") } },
                { type: "section", text: { type: "mrkdwn", text: ("*Status:* " + $status) } },
                { type: "section", text: { type: "mrkdwn", text: ("*Failing tests:*\n```" + $results + "```") } },
                { type: "section", text: { type: "mrkdwn", text: ("*Full results:*\n```" + $block + "```") } },
                { type: "section", text: { type: "mrkdwn", text: ("<" + $url + "|View workflow run, logs & artifacts>") } }
              ]
            }')
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$PAYLOAD" > /dev/null

      - name: Log Test Failure (Job Continues)
        if: always() && env.TEST_FAILED == 'true'
        run: |
          echo "One or more Selenium tests failed."
          echo "TEST_EXIT_CODE: ${TEST_EXIT_CODE:-0}"
          echo "TEST_RESULTS: ${TEST_RESULTS}"
          echo "TOTAL_TESTS: ${TOTAL_TESTS}"
          echo "PASSED_TESTS: ${PASSED_TESTS}"
          echo "FAILED_TESTS: ${FAILED_TESTS}"
          echo "SKIPPED_TESTS: ${SKIPPED_TESTS}"
          echo "TEST_FAILED: ${TEST_FAILED}"
          echo "FAIL_REASON: ${FAIL_REASON}"
          echo "FORMATTED_RESULTS: ${FORMATTED_RESULTS}"
          echo "SUMMARY_LINE: ${SUMMARY_LINE}"
          echo "STATUS_LINE: ${STATUS_LINE}"
