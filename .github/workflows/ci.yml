name: Selenium CI Pipeline

on:
  push:
    branches: [ master ]
  repository_dispatch:
    types: [ newsletter-update ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # 🔥 prevents matrix cancellation
      matrix:
        java-version: [ '11', '17' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Install Dependencies
        run: mvn clean install -DskipTests

      # 🔑 Run tests and capture exit code
      - name: Run Selenium Tests
        id: selenium_tests
        continue-on-error: true
        run: |
          mvn test -B -V
          if [ $? -ne 0 ]; then
            echo "TEST_FAILED=true" >> $GITHUB_ENV
          else
            echo "TEST_FAILED=false" >> $GITHUB_ENV
          fi

      # 🔍 Check report directory
      - name: Check Test Reports
        id: check_reports
        continue-on-error: true
        run: |
          if [ -d target/surefire-reports ]; then
            echo "REPORTS_EXIST=true" >> $GITHUB_ENV
          else
            echo "REPORTS_EXIST=false" >> $GITHUB_ENV
          fi

      # 📦 Upload reports only if they exist
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-reports-java-${{ matrix.java-version }}
          path: target/surefire-reports
          retention-days: 30

      # 📋 Generate Test Summary
      - name: Generate Test Summary
        if: always()
        continue-on-error: true
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d target/surefire-reports ]; then
            echo "### Test Reports Generated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Reports Location:** \`target/surefire-reports/\`" >> $GITHUB_STEP_SUMMARY
            if [ -f target/surefire-reports/index.html ]; then
              echo "- HTML Report available" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Java Version:** ${{ matrix.java-version }}" >> $GITHUB_STEP_SUMMARY

      # 📸 Upload screenshots only if they exist
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-screenshots-java-${{ matrix.java-version }}
          path: |
            target/**/*.png
            screenshots/**/*.png
          retention-days: 30

      # 📊 Parse Test Results
      - name: Parse Test Results
        if: always()
        continue-on-error: true
        run: |
          if [ -d target/surefire-reports ]; then
            # Install xmlstarlet
            sudo apt-get update -qq && sudo apt-get install -y -qq xmlstarlet > /dev/null 2>&1
            
            # Create results file
            > /tmp/test_results.txt
            
            # Parse XML files
            for xml_file in target/surefire-reports/TEST-*.xml; do
              if [ -f "$xml_file" ]; then
                # Get all testcase elements, filter out setUp/tearDown
                xmlstarlet sel -t \
                  -m "//testcase" \
                  -v "@name" -o "|" \
                  -v "@time" -o "|" \
                  -i "failure" -o "FAIL" -b \
                  -i "error" -o "ERROR" -b \
                  -i "not(failure) and not(error)" -o "PASS" -b \
                  -n \
                  "$xml_file" 2>/dev/null >> /tmp/all_tests.txt
              fi
            done
            
            # Filter and format results
            if [ -f /tmp/all_tests.txt ]; then
              grep -v "setUp\|tearDown\|setUpClass\|tearDownClass" /tmp/all_tests.txt | while IFS='|' read -r name time status; do
                # Round time to 1 decimal
                rounded_time=$(printf "%.1f" "$time" 2>/dev/null || echo "$time")
                
                # Add status emoji
                if [ "$status" = "PASS" ]; then
                  echo "PASS $name (${rounded_time}s)"
                elif [ "$status" = "FAIL" ]; then
                  echo "FAIL $name (${rounded_time}s)"
                elif [ "$status" = "ERROR" ]; then
                  echo "ERROR $name (${rounded_time}s)"
                fi
              done > /tmp/test_results.txt
            fi
            
            # Get counts
            TOTAL=$(wc -l < /tmp/test_results.txt)
            PASSED=$(grep -c "^PASS" /tmp/test_results.txt || echo 0)
            FAILED=$(grep -c "^FAIL\|^ERROR" /tmp/test_results.txt || echo 0)
            
            # Limit to first 20 results
            RESULTS=$(head -20 /tmp/test_results.txt)
            if [ $TOTAL -gt 20 ]; then
              RESULTS="$RESULTS"$'\n'"... and $((TOTAL - 20)) more tests"
            fi
            
            # Save to env (escape for JSON)
            echo "TEST_RESULTS<<EOFMARKER" >> $GITHUB_ENV
            echo "$RESULTS" >> $GITHUB_ENV
            echo "EOFMARKER" >> $GITHUB_ENV
            
            echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV
            echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
            echo "FAILED_TESTS=$FAILED" >> $GITHUB_ENV
          else
            echo "TEST_RESULTS=No test reports found" >> $GITHUB_ENV
            echo "TOTAL_TESTS=0" >> $GITHUB_ENV
            echo "PASSED_TESTS=0" >> $GITHUB_ENV
            echo "FAILED_TESTS=0" >> $GITHUB_ENV
          fi

      # ✅ Slack PASS
      - name: Slack Notification - Success
        if: success()
        run: |
          # Format results for Slack (add checkmarks)
          FORMATTED=$(echo "$TEST_RESULTS" | sed 's/^PASS /✅ /g' | sed 's/^FAIL /❌ /g' | sed 's/^ERROR /❌ /g')
          
          # Escape for JSON
          ESCAPED=$(echo "$FORMATTED" | jq -Rs .)
          
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          -H 'Content-Type: application/json' \
          -d '{
            "text": "✅ Selenium Tests PASSED",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "✅ Selenium Tests PASSED"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Java:* ${{ matrix.java-version }}\n*Commit:* `${{ github.sha }}`"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Summary:* '"$PASSED_TESTS"'/'"$TOTAL_TESTS"' passed ✅"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Results:*\n```'"$(echo $ESCAPED | jq -r .)"'```"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                }
              }
            ]
          }'

      # ❌ Slack FAIL
      - name: Slack Notification - Failure
        if: failure()
        run: |
          # Format results for Slack (add checkmarks)
          FORMATTED=$(echo "$TEST_RESULTS" | sed 's/^PASS /✅ /g' | sed 's/^FAIL /❌ /g' | sed 's/^ERROR /❌ /g')
          
          # Escape for JSON
          ESCAPED=$(echo "$FORMATTED" | jq -Rs .)
          
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          -H 'Content-Type: application/json' \
          -d '{
            "text": "❌ Selenium Tests FAILED",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "❌ Selenium Tests FAILED"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Java:* ${{ matrix.java-version }}\n*Commit:* `${{ github.sha }}`"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Summary:* '"$PASSED_TESTS"' passed, '"$FAILED_TESTS"' failed ('"$TOTAL_TESTS"' total) ⚠️"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Results:*\n```'"$(echo $ESCAPED | jq -r .)"'```"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Full Logs & Screenshots>"
                }
              }
            ]
          }'