name: Selenium CI Pipeline

# GitHub Actions workflow that runs the Java Selenium newsletter tests
# on every change to master and reports rich results via artifacts,
# Slack notifications and email.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Optional: custom trigger for external systems (e.g. dashboards, schedulers).
  repository_dispatch:
    types: [ newsletter-update ]
  # Manual trigger so tests can be run on demand from the GitHub UI.
  workflow_dispatch:

jobs:
  # Single job responsible for compiling the project,
  # executing Selenium tests and sending notifications.
  selenium-tests:
    # Use the latest Ubuntu runner image as the execution environment.
    runs-on: ubuntu-latest
    # Environment variables, mostly sourced from encrypted GitHub secrets.
    env:
      # Incoming webhook URL used by the Slack notification steps.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # SMTP configuration for email notifications (Gmail: smtp.gmail.com, port 587)
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      # Comma‑separated list of email recipients for the notification actions.
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      # Run Chrome/Selenium in headless mode on CI runners.
      CI: "true"
      HEADLESS: "true"

    # Strategy/matrix definition – currently only Java 17,
    # but can be extended to multiple versions if needed.
    strategy:
      # Do not cancel other matrix runs if one fails; we still
      # want complete reporting from every variant.
      fail-fast: false
      matrix:
        java-version: [ "17" ]

    steps:
      # 1) Prepare the Java project
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Install Dependencies
        run: mvn clean install -DskipTests

      # 2) Execute the JUnit/Selenium test suite.
      - name: Run Selenium Tests
        id: selenium_tests
        continue-on-error: true
        run: |
          set +e
          mvn test -B -V
          TEST_EXIT=$?
          set -e
          echo "TEST_EXIT_CODE=$TEST_EXIT" >> $GITHUB_ENV

      # 3) Persist raw XML test reports as downloadable artifacts.
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-reports-java-${{ matrix.java-version }}
          path: target/surefire-reports
          retention-days: 30

      # 4) Upload any screenshots produced during failing test runs.
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-screenshots-java-${{ matrix.java-version }}
          path: |
            target/**/*.png
            screenshots/**/*.png
          retention-days: 30

      # 5) Upload Java util.logging output files to aid debugging and traceability.
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-logs-java-${{ matrix.java-version }}
          path: target/logs
          retention-days: 30

      # 6) Parse XML results into aggregated statistics and a
      #    compact, human‑readable summary for notifications.
      - name: Parse Test Results
        if: always()
        continue-on-error: true
        run: |
          set +e
          sudo apt-get update -qq > /dev/null 2>&1
          # xmlstarlet is used to parse TestNG/JUnit XML reports; jq is used to safely construct Slack JSON.
          sudo apt-get install -y -qq xmlstarlet jq > /dev/null 2>&1
          set -e

          REPORT_DIR="target/surefire-reports"
          TESTNG_REPORT="${REPORT_DIR}/testng-results.xml"

          TOTAL=0
          PASSED=0
          FAILED=0
          SKIPPED=0

          > /tmp/test_results.txt
          > /tmp/failed_tests.txt

          # JUnit XML (JUnit 5 / Surefire) - extract class#name, status, and failure message for traceability
            if [ -d "$REPORT_DIR" ]; then
              for f in "$REPORT_DIR"/TEST-*.xml; do
                [ -f "$f" ] || continue
                xmlstarlet sel -t \
                  -m "//testcase" \
                  -v "@classname" -o "#" -v "@name" -o "|" \
                  -v "name((failure|error)[1])" -o "|" \
                  -v "(failure|error)[1]/@message" -n \
                  "$f" 2>/dev/null || true
              done > /tmp/junit_cases.txt 2>/dev/null || true
            fi

            TOTAL=$(awk -F'|' 'NF>=2{c++} END{print c+0}' /tmp/junit_cases.txt 2>/dev/null || echo 0)
            FAILED=$(awk -F'|' 'tolower($2)=="failure" || tolower($2)=="error"{c++} END{print c+0}' /tmp/junit_cases.txt 2>/dev/null || echo 0)
            PASSED=$((TOTAL - FAILED))
            SKIPPED=0

            if [ "$FAILED" -gt 0 ]; then
              awk -F'|' 'tolower($2)=="failure" || tolower($2)=="error" {
                msg = ""; for (i=3;i<=NF;i++) msg = msg (i>3?"|":"") $i
                if (msg != "") msg = " — " msg
                print "FAIL " $1 msg
              }' /tmp/junit_cases.txt | sed 's/com\.newsletter\.tests\.//g' | sort -u | head -20 > /tmp/test_results.txt || true
            else
              awk -F'|' 'NF{print "PASS "$1}' /tmp/junit_cases.txt | sed 's/com\.newsletter\.tests\.//g' | sort -u | head -20 > /tmp/test_results.txt || true
              echo "... (showing up to 20 passing tests)" >> /tmp/test_results.txt
            fi


          RESULTS=$(cat /tmp/test_results.txt)
          if [ -z "$RESULTS" ]; then
            RESULTS="No parsed test case results found."
          fi

          echo "TEST_RESULTS<<EOFMARKER" >> $GITHUB_ENV
          echo "$RESULTS" >> $GITHUB_ENV
          echo "EOFMARKER" >> $GITHUB_ENV
          echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV
          echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
          echo "FAILED_TESTS=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED_TESTS=$SKIPPED" >> $GITHUB_ENV

          # Determine pipeline status:
          # - If any tests failed -> fail
          # - Else if Maven returned a non-zero code -> fail (build/runtime error)
          # - Else -> success
          if [ "$FAILED" -gt 0 ]; then
            echo "TEST_FAILED=true" >> $GITHUB_ENV
            echo "FAIL_REASON=test_failures" >> $GITHUB_ENV
          elif [ "${TEST_EXIT_CODE:-0}" -ne 0 ]; then
            echo "TEST_FAILED=true" >> $GITHUB_ENV
            echo "FAIL_REASON=build_error" >> $GITHUB_ENV
          else
            echo "TEST_FAILED=false" >> $GITHUB_ENV
            echo "FAIL_REASON=none" >> $GITHUB_ENV
          fi

      # 7) Convert the parsed results into strings friendly for
      #    Slack and email (including emojis and summary line).
      - name: Format Notification Payload
        if: always()
        run: |
          FORMATTED=$(echo "$TEST_RESULTS" | sed 's/^PASS /✅ /g' | sed 's/^FAIL /❌ /g')
          echo "FORMATTED_RESULTS<<EOFMARKER" >> $GITHUB_ENV
          echo "$FORMATTED" >> $GITHUB_ENV
          echo "EOFMARKER" >> $GITHUB_ENV

          SUMMARY="${PASSED_TESTS} passed · ${FAILED_TESTS} failed · ${SKIPPED_TESTS} skipped · ${TOTAL_TESTS} total"
          echo "SUMMARY_LINE=$SUMMARY" >> $GITHUB_ENV

          if [ "${TEST_FAILED}" = "true" ] && [ "${FAIL_REASON}" = "build_error" ]; then
            echo "STATUS_LINE=:x: Build error (mvn exit code ${TEST_EXIT_CODE}). ${SUMMARY}" >> $GITHUB_ENV
          elif [ "${TEST_FAILED}" = "true" ]; then
            echo "STATUS_LINE=:x: Test failures. ${SUMMARY}" >> $GITHUB_ENV
          else
            echo "STATUS_LINE=:white_check_mark: Tests passed. ${SUMMARY}" >> $GITHUB_ENV
          fi

      # 8) Write a rich markdown summary into the GitHub Actions
      #    run summary page.
      - name: Generate Test Summary
        if: always()
        continue-on-error: true
        run: |
          echo "## 📋 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Java Version** | ${{ matrix.java-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | $([ "${TEST_FAILED}" = "true" ] && echo "❌ Failed" || echo "✅ Passed") |" >> $GITHUB_STEP_SUMMARY
          echo "| **Exit Code** | ${TEST_EXIT_CODE:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | Failed | Skipped | Total |" >> $GITHUB_STEP_SUMMARY
          echo "|:---:|:---:|:---:|:---:|" >> $GITHUB_STEP_SUMMARY
          echo "| ${PASSED_TESTS} | ${FAILED_TESTS} | ${SKIPPED_TESTS} | ${TOTAL_TESTS} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${TEST_FAILED}" = "true" ] && [ -n "$FORMATTED_RESULTS" ]; then
            echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$FORMATTED_RESULTS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d target/surefire-reports ]; then
            echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
            echo "- Reports: \`target/surefire-reports/\`" >> $GITHUB_STEP_SUMMARY
          fi

      # 9) Send success notification to Slack (if configured).
      - name: Slack Notification - Success
        if: always() && env.TEST_FAILED == 'false' && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          META="*Repository:* ${{ github.repository }} · *Branch:* ${{ github.ref_name }} · *Java:* ${{ matrix.java-version }} · *Commit:* \`$SHORT_SHA\`"
          PAYLOAD=$(jq -n \
            --arg text "✅ Selenium Tests PASSED" \
            --arg meta "$META" \
            --arg summary "$SUMMARY_LINE" \
            --arg results "$FORMATTED_RESULTS" \
            --arg url "$RUN_URL" \
            '{
              text: $text,
              blocks: [
                { type: "header", text: { type: "plain_text", text: "✅ Selenium Tests PASSED", emoji: true } },
                { type: "section", text: { type: "mrkdwn", text: $meta } },
                { type: "section", text: { type: "mrkdwn", text: ("*Summary*\n" + $summary) } },
                { type: "section", text: { type: "mrkdwn", text: ("*Results*\n```" + $results + "```") } },
                { type: "divider" },
                { type: "section", text: { type: "mrkdwn", text: ("<" + $url + "|View workflow run & artifacts →>") } }
              ]
            }')
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$PAYLOAD" > /dev/null

      # 10) Send failure notification to Slack (if configured).
      - name: Slack Notification - Failure
        if: always() && env.TEST_FAILED == 'true' && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          META="*Repository:* ${{ github.repository }} · *Branch:* ${{ github.ref_name }} · *Java:* ${{ matrix.java-version }} · *Commit:* \`$SHORT_SHA\`"
          RESULTS_BLOCK=$'*Exit code:* '"${TEST_EXIT_CODE:-0}"$' · *Reason:* '"${FAIL_REASON}"$'\n*Summary:* '"${SUMMARY_LINE}"$'\n\n*Failed test(s):*\n```\n'"${FORMATTED_RESULTS}"$'\n```'

          PAYLOAD=$(jq -n \
            --arg text "❌ Selenium Tests Failed" \
            --arg meta "$META" \
            --arg block "$RESULTS_BLOCK" \
            --arg url "$RUN_URL" \
            '{
              text: $text,
              blocks: [
                { type: "header", text: { type: "plain_text", text: "❌ Selenium Tests Failed", emoji: true } },
                { type: "section", text: { type: "mrkdwn", text: $meta } },
                { type: "section", text: { type: "mrkdwn", text: $block } },
                { type: "divider" },
                { type: "section", text: { type: "mrkdwn", text: ("<" + $url + "|View workflow run, logs & artifacts →>") } }
              ]
            }')
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$PAYLOAD" > /dev/null

      # 11) Send success notification email (if SMTP secrets exist).
      - name: Email Notification - Success
        if: always() && env.TEST_FAILED == 'false' && env.SMTP_PASSWORD != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ env.SMTP_HOST }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USER }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "✅ Selenium Tests PASSED - ${{ github.repository }} (Java ${{ matrix.java-version }})"
          from: "Selenium CI <${{ env.SMTP_USER }}>"
          to: ${{ env.EMAIL_TO }}
          html_body: |
            <!DOCTYPE html>
            <html>
            <head><meta charset="utf-8"><style>body{font-family:Segoe UI,Helvetica,Arial,sans-serif;margin:24px;color:#333;line-height:1.5}.header{background:#22c55e;color:white;padding:16px 20px;border-radius:8px;margin-bottom:24px;font-size:18px;font-weight:600}.meta{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:16px;margin-bottom:20px}.meta p{margin:6px 0}.table{border-collapse:collapse;width:100%;max-width:320px;margin:16px 0}.table th,.table td{border:1px solid #e2e8f0;padding:10px 14px;text-align:left}.table th{background:#f1f5f9;font-weight:600}.results{background:#f8fafc;border-radius:6px;padding:12px;font-family:monospace;font-size:13px;white-space:pre-wrap;margin:16px 0}.link{color:#2563eb;text-decoration:none}.footer{margin-top:24px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:13px;color:#64748b}</style></head>
            <body>
            <div class="header">✅ Selenium Tests PASSED</div>
            <div class="meta">
              <p><strong>Repository:</strong> ${{ github.repository }}</p>
              <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
              <p><strong>Java Version:</strong> ${{ matrix.java-version }}</p>
              <p><strong>Commit:</strong> <code>${{ github.sha }}</code></p>
            </div>
            <table class="table">
              <tr><th>Passed</th><th>Failed</th><th>Skipped</th><th>Total</th></tr>
              <tr><td>${{ env.PASSED_TESTS }}</td><td>${{ env.FAILED_TESTS }}</td><td>${{ env.SKIPPED_TESTS }}</td><td>${{ env.TOTAL_TESTS }}</td></tr>
            </table>
            <p><strong>Results</strong></p>
            <div class="results">${{ env.FORMATTED_RESULTS }}</div>
            <p class="footer"><a class="link" href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View workflow run & artifacts →</a></p>
            </body>
            </html>

      # 12) Send failure notification email (if SMTP secrets exist).
      - name: Email Notification - Failure
        if: always() && env.TEST_FAILED == 'true' && env.SMTP_PASSWORD != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ env.SMTP_HOST }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USER }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "❌ Selenium Tests Failed - ${{ github.repository }} (Java ${{ matrix.java-version }})"
          from: "Selenium CI <${{ env.SMTP_USER }}>"
          to: ${{ env.EMAIL_TO }}
          html_body: |
            <!DOCTYPE html>
            <html>
            <head><meta charset="utf-8"><style>body{font-family:Segoe UI,Helvetica,Arial,sans-serif;margin:24px;color:#333;line-height:1.5}.header{background:#dc2626;color:white;padding:16px 20px;border-radius:8px;margin-bottom:24px;font-size:18px;font-weight:600}.meta{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:16px;margin-bottom:20px}.meta p{margin:6px 0}.table{border-collapse:collapse;width:100%;max-width:320px;margin:16px 0}.table th,.table td{border:1px solid #e2e8f0;padding:10px 14px;text-align:left}.table th{background:#f1f5f9;font-weight:600}.results{background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:12px;font-family:monospace;font-size:13px;white-space:pre-wrap;margin:16px 0}.link{color:#2563eb;text-decoration:none}.footer{margin-top:24px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:13px;color:#64748b}.stat{display:inline-block;margin-right:16px;margin-bottom:8px}</style></head>
            <body>
            <div class="header">❌ Selenium Tests Failed</div>
            <div class="meta">
              <p><strong>Repository:</strong> ${{ github.repository }}</p>
              <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
              <p><strong>Java Version:</strong> ${{ matrix.java-version }}</p>
              <p><strong>Commit:</strong> <code>${{ github.sha }}</code></p>
            </div>
            <p><strong>Summary</strong></p>
            <p><span class="stat">Exit code: <code>${{ env.TEST_EXIT_CODE }}</code></span><span class="stat">Reason: <code>${{ env.FAIL_REASON }}</code></span></p>
            <table class="table">
              <tr><th>Passed</th><th>Failed</th><th>Skipped</th><th>Total</th></tr>
              <tr><td>${{ env.PASSED_TESTS }}</td><td>${{ env.FAILED_TESTS }}</td><td>${{ env.SKIPPED_TESTS }}</td><td>${{ env.TOTAL_TESTS }}</td></tr>
            </table>
            <p><strong>Failed test(s)</strong></p>
            <div class="results">${{ env.FORMATTED_RESULTS }}</div>
            <p class="footer"><a class="link" href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View workflow run, logs & artifacts →</a></p>
            </body>
            </html>

      # 13) Always log a concise failure summary to the job logs
      #     so that information is available even without Slack/email.
      - name: Log Test Failure (Job Continues)
        if: always() && env.TEST_FAILED == 'true'
        run: |
          echo "One or more Selenium tests failed."
          echo "TEST_EXIT_CODE: ${TEST_EXIT_CODE:-0}"
          echo "TEST_RESULTS: ${TEST_RESULTS}"
          echo "TOTAL_TESTS: ${TOTAL_TESTS}"
          echo "PASSED_TESTS: ${PASSED_TESTS}"
          echo "FAILED_TESTS: ${FAILED_TESTS}"
          echo "SKIPPED_TESTS: ${SKIPPED_TESTS}"
          echo "TEST_FAILED: ${TEST_FAILED}"
          echo "FAIL_REASON: ${FAIL_REASON}"
          echo "FORMATTED_RESULTS: ${FORMATTED_RESULTS}"
          echo "SUMMARY_LINE: ${SUMMARY_LINE}"
          echo "STATUS_LINE: ${STATUS_LINE}"
