name: Selenium CI Pipeline

on:
  push:
    branches: [ master ]
  repository_dispatch:
    types: [ newsletter-update ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # 🔥 prevents matrix cancellation
      matrix:
        java-version: [ '11', '17' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Install Dependencies
        run: mvn clean install -DskipTests

      # 🔑 Run tests and capture exit code
      - name: Run Selenium Tests
        id: selenium_tests
        continue-on-error: true
        run: |
          mvn test -B -V
          if [ $? -ne 0 ]; then
            echo "TEST_FAILED=true" >> $GITHUB_ENV
          else
            echo "TEST_FAILED=false" >> $GITHUB_ENV
          fi

      # 🔍 Check report directory
      - name: Check Test Reports
        id: check_reports
        continue-on-error: true
        run: |
          if [ -d target/surefire-reports ]; then
            echo "REPORTS_EXIST=true" >> $GITHUB_ENV
          else
            echo "REPORTS_EXIST=false" >> $GITHUB_ENV
          fi

      # 📦 Upload reports only if they exist
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-reports-java-${{ matrix.java-version }}
          path: target/surefire-reports
          retention-days: 30

      # 📋 Generate Test Summary
      - name: Generate Test Summary
        if: always()
        continue-on-error: true
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d target/surefire-reports ]; then
            echo "### Test Reports Generated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Reports Location:** \`target/surefire-reports/\`" >> $GITHUB_STEP_SUMMARY
            if [ -f target/surefire-reports/index.html ]; then
              echo "- HTML Report available" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Java Version:** ${{ matrix.java-version }}" >> $GITHUB_STEP_SUMMARY

      # 📸 Upload screenshots only if they exist
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-screenshots-java-${{ matrix.java-version }}
          path: |
            target/**/*.png
            screenshots/**/*.png
          retention-days: 30

      # 📊 Parse Test Results
      - name: Parse Test Results
        if: always()
        continue-on-error: true
        run: |
          if [ -d target/surefire-reports ]; then
            # Parse XML reports for test results
            RESULTS=$(find target/surefire-reports -name "TEST-*.xml" -type f | while read file; do
              # Extract test case results using grep and sed
              grep -o '<testcase[^>]*name="[^"]*"[^>]*time="[^"]*"[^>]*classname="[^"]*"' "$file" | while read line; do
                TEST_NAME=$(echo "$line" | sed -n 's/.*name="\([^"]*\)".*/\1/p')
                CLASS_NAME=$(echo "$line" | sed -n 's/.*classname="\([^"]*\)".*/\1/p')
                TIME=$(echo "$line" | sed -n 's/.*time="\([^"]*\)".*/\1/p')
                
                # Check if test failed or had error
                TEST_BLOCK_START=$(grep -n "name=\"$TEST_NAME\"" "$file" | cut -d: -f1)
                if [ ! -z "$TEST_BLOCK_START" ]; then
                  # Get the next few lines to check for failure/error
                  TEST_CONTENT=$(sed -n "${TEST_BLOCK_START},$((TEST_BLOCK_START+10))p" "$file")
                  if echo "$TEST_CONTENT" | grep -q "<failure\|<error"; then
                    echo "❌ $TEST_NAME (${TIME}s)"
                  else
                    echo "✅ $TEST_NAME (${TIME}s)"
                  fi
                fi
              done
            done)
            
            # Count totals
            TOTAL=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -o '<testcase' {} \; | wc -l)
            FAILURES=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -o '<failure' {} \; | wc -l)
            ERRORS=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -o '<error' {} \; | wc -l)
            PASSED=$((TOTAL - FAILURES - ERRORS))
            
            # Format results for Slack (escape special characters)
            FORMATTED_RESULTS=$(echo "$RESULTS" | sed 's/"/\\"/g' | awk '{printf "%s\\n", $0}' | head -30)
            
            echo "TEST_RESULTS<<EOF" >> $GITHUB_ENV
            echo "$FORMATTED_RESULTS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            
            echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV
            echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
            echo "FAILED_TESTS=$((FAILURES + ERRORS))" >> $GITHUB_ENV
          else
            echo "TEST_RESULTS=No test reports found" >> $GITHUB_ENV
            echo "TOTAL_TESTS=0" >> $GITHUB_ENV
            echo "PASSED_TESTS=0" >> $GITHUB_ENV
            echo "FAILED_TESTS=0" >> $GITHUB_ENV
          fi

      # ✅ Slack PASS
      - name: Slack Notification - Success
        if: success()
        run: |
          RESULTS="${TEST_RESULTS:-No results available}"
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-Type: application/json' \
          -d "{
            \"text\": \"✅ Selenium Tests PASSED\",
            \"blocks\": [
              {
                \"type\": \"header\",
                \"text\": {
                  \"type\": \"plain_text\",
                  \"text\": \"✅ Selenium Tests PASSED\"
                }
              },
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Repo:* ${{ github.repository }}\\n*Branch:* ${{ github.ref_name }}\\n*Java:* ${{ matrix.java-version }}\\n*Commit:* ${{ github.sha }}\"
                }
              },
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Test Summary:* ${PASSED_TESTS}/${TOTAL_TESTS} passed ✅\"
                }
              },
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Test Results:*\\n\`\`\`${RESULTS}\`\`\`\"
                }
              },
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>\"
                }
              }
            ]
          }"

      # ❌ Slack FAIL
      - name: Slack Notification - Failure
        if: failure()
        run: |
          RESULTS="${TEST_RESULTS:-No results available}"
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-Type: application/json' \
          -d "{
            \"text\": \"❌ Selenium Tests FAILED\",
            \"blocks\": [
              {
                \"type\": \"header\",
                \"text\": {
                  \"type\": \"plain_text\",
                  \"text\": \"❌ Selenium Tests FAILED\"
                }
              },
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Repo:* ${{ github.repository }}\\n*Branch:* ${{ github.ref_name }}\\n*Java:* ${{ matrix.java-version }}\\n*Commit:* ${{ github.sha }}\"
                }
              },
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Test Summary:* ${PASSED_TESTS} passed, ${FAILED_TESTS} failed out of ${TOTAL_TESTS} total\"
                }
              },
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Test Results:*\\n\`\`\`${RESULTS}\`\`\`\"
                }
              },
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Full Logs & Screenshots>\"
                }
              }
            ]
          }"