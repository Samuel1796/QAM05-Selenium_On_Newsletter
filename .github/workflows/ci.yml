name: Selenium CI Pipeline

on:
  push:
    branches: [ master ]
  repository_dispatch:
    types: [ newsletter-update ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    strategy:
      fail-fast: false
      matrix:
        java-version: [ "11", "17" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Install Dependencies
        run: mvn clean install -DskipTests

      - name: Run Selenium Tests
        id: selenium_tests
        continue-on-error: true
        run: |
          set +e
          mvn test -B -V
          TEST_EXIT=$?
          set -e

          if [ $TEST_EXIT -ne 0 ]; then
            echo "TEST_FAILED=true" >> $GITHUB_ENV
          else
            echo "TEST_FAILED=false" >> $GITHUB_ENV
          fi
          echo "TEST_EXIT_CODE=$TEST_EXIT" >> $GITHUB_ENV

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-reports-java-${{ matrix.java-version }}
          path: target/surefire-reports
          retention-days: 30

      - name: Generate Test Summary
        if: always()
        continue-on-error: true
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Java Version:** ${{ matrix.java-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Exit Code:** $TEST_EXIT_CODE" >> $GITHUB_STEP_SUMMARY

          if [ -d target/surefire-reports ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Test Reports Generated" >> $GITHUB_STEP_SUMMARY
            echo "**Reports Location:** \`target/surefire-reports/\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No surefire reports directory found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-screenshots-java-${{ matrix.java-version }}
          path: |
            target/**/*.png
            screenshots/**/*.png
          retention-days: 30

      - name: Parse Test Results
        if: always()
        continue-on-error: true
        run: |
          > /tmp/test_results.txt
          TOTAL=0
          PASSED=0
          FAILED=0
          FAILURES=0
          ERRORS=0
          SKIPPED=0

          if [ -d target/surefire-reports ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xmlstarlet > /dev/null 2>&1

            > /tmp/all_tests.txt
            for xml_file in target/surefire-reports/TEST-*.xml; do
              if [ -f "$xml_file" ]; then
                xmlstarlet sel -t \
                  -m "//testcase" \
                  -v "@name" -o "|" \
                  -v "@time" -o "|" \
                  -v "name((failure|error)[1])" \
                  -n \
                  "$xml_file" 2>/dev/null >> /tmp/all_tests.txt
              fi
            done

            if [ -f /tmp/all_tests.txt ]; then
              grep -v "setUp\|tearDown\|setUpClass\|tearDownClass" /tmp/all_tests.txt | while IFS='|' read -r name time status; do
                rounded_time=$(printf "%.1f" "$time" 2>/dev/null || echo "$time")
                if [ "$status" = "failure" ]; then
                  echo "FAIL $name (${rounded_time}s)"
                elif [ "$status" = "error" ]; then
                  echo "ERROR $name (${rounded_time}s)"
                else
                  echo "PASS $name (${rounded_time}s)"
                fi
              done > /tmp/test_results.txt
            fi

            TOTAL=$(xmlstarlet sel -t -v "sum(//testsuite/@tests)" target/surefire-reports/TEST-*.xml 2>/dev/null | awk '{printf "%.0f", $1}')
            FAILURES=$(xmlstarlet sel -t -v "sum(//testsuite/@failures)" target/surefire-reports/TEST-*.xml 2>/dev/null | awk '{printf "%.0f", $1}')
            ERRORS=$(xmlstarlet sel -t -v "sum(//testsuite/@errors)" target/surefire-reports/TEST-*.xml 2>/dev/null | awk '{printf "%.0f", $1}')
            SKIPPED=$(xmlstarlet sel -t -v "sum(//testsuite/@skipped)" target/surefire-reports/TEST-*.xml 2>/dev/null | awk '{printf "%.0f", $1}')
            FAILED=$((FAILURES + ERRORS))
            PASSED=$((TOTAL - FAILED - SKIPPED))
            if [ "$PASSED" -lt 0 ]; then PASSED=0; fi
          fi

          if [ "$TOTAL" -eq 0 ]; then
            TOTAL=$(wc -l < /tmp/test_results.txt)
            PASSED=$(grep -c "^PASS" /tmp/test_results.txt || echo 0)
            FAILED=$(grep -c "^FAIL\|^ERROR" /tmp/test_results.txt || echo 0)
          fi

          RESULTS=$(head -20 /tmp/test_results.txt)
          if [ "$TOTAL" -gt 20 ]; then
            RESULTS="$RESULTS"$'\n'"... and $((TOTAL - 20)) more tests"
          fi
          if [ -z "$RESULTS" ]; then
            RESULTS="No parsed test case results found."
          fi

          echo "TEST_RESULTS<<EOFMARKER" >> $GITHUB_ENV
          echo "$RESULTS" >> $GITHUB_ENV
          echo "EOFMARKER" >> $GITHUB_ENV
          echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV
          echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
          echo "FAILED_TESTS=$FAILED" >> $GITHUB_ENV
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL_REASON=test_failures" >> $GITHUB_ENV
          elif [ "${TEST_FAILED:-false}" = "true" ]; then
            echo "FAIL_REASON=build_error" >> $GITHUB_ENV
          else
            echo "FAIL_REASON=none" >> $GITHUB_ENV
          fi

      - name: Format Notification Payload
        if: always()
        run: |
          FORMATTED=$(echo "$TEST_RESULTS" | sed 's/^PASS /:white_check_mark: /g' | sed 's/^FAIL /:x: /g' | sed 's/^ERROR /:x: /g')
          echo "FORMATTED_RESULTS<<EOFMARKER" >> $GITHUB_ENV
          echo "$FORMATTED" >> $GITHUB_ENV
          echo "EOFMARKER" >> $GITHUB_ENV

          EMAIL_RESULTS=$(echo "$FORMATTED" | sed ':a;N;$!ba;s/\n/<br>/g')
          echo "EMAIL_RESULTS<<EOFMARKER" >> $GITHUB_ENV
          echo "$EMAIL_RESULTS" >> $GITHUB_ENV
          echo "EOFMARKER" >> $GITHUB_ENV
          if [ "${FAIL_REASON}" = "test_failures" ]; then
            echo "FAIL_SUMMARY=${PASSED_TESTS} passed, ${FAILED_TESTS} failed (${TOTAL_TESTS} total) :warning:" >> $GITHUB_ENV
          else
            echo "FAIL_SUMMARY=${PASSED_TESTS} passed, ${FAILED_TESTS} failed (${TOTAL_TESTS} total). Build failed with exit code ${TEST_EXIT_CODE}." >> $GITHUB_ENV
          fi

      - name: Slack Notification - Success
        if: always() && env.TEST_FAILED == 'false' && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          ESCAPED=$(echo "$FORMATTED_RESULTS" | jq -Rs .)
          curl -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -d '{
            "text": ":white_check_mark: Selenium Tests PASSED",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "Selenium Tests PASSED"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Java:* ${{ matrix.java-version }}\n*Commit:* `${{ github.sha }}`"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Summary:* '"$PASSED_TESTS"'/'"$TOTAL_TESTS"' passed :white_check_mark:"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Results:*\n```'"$(echo "$ESCAPED" | jq -r .)"'```"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                }
              }
            ]
          }'

      - name: Slack Notification - Failure
        if: always() && env.TEST_FAILED == 'true' && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          ESCAPED=$(echo "$FORMATTED_RESULTS" | jq -Rs .)
          curl -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -d '{
            "text": ":x: Selenium Tests FAILED",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "Selenium Tests FAILED"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Java:* ${{ matrix.java-version }}\n*Commit:* `${{ github.sha }}`"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Summary:* '"$FAIL_SUMMARY"'"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Results:*\n```'"$(echo "$ESCAPED" | jq -r .)"'```"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Full Logs & Screenshots>"
                }
              }
            ]
          }'

      - name: Email Notification - Success
        if: always() && env.TEST_FAILED == 'false' && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.EMAIL_FROM != '' && env.EMAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          secure: false
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "[${{ matrix.java-version }}] Selenium Tests PASSED - ${{ github.repository }}"
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}
          html_body: |
            <h2>:white_check_mark: Selenium Tests PASSED</h2>
            <p><strong>Repo:</strong> ${{ github.repository }}<br>
            <strong>Branch:</strong> ${{ github.ref_name }}<br>
            <strong>Java:</strong> ${{ matrix.java-version }}<br>
            <strong>Commit:</strong> <code>${{ github.sha }}</code></p>
            <p><strong>Test Summary:</strong> ${{ env.PASSED_TESTS }}/${{ env.TOTAL_TESTS }} passed :white_check_mark:</p>
            <p><strong>Test Results:</strong><br>${{ env.EMAIL_RESULTS }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a></p>

      - name: Email Notification - Failure
        if: always() && env.TEST_FAILED == 'true' && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.EMAIL_FROM != '' && env.EMAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          secure: false
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "[${{ matrix.java-version }}] Selenium Tests FAILED - ${{ github.repository }}"
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}
          html_body: |
            <h2>:x: Selenium Tests FAILED</h2>
            <p><strong>Repo:</strong> ${{ github.repository }}<br>
            <strong>Branch:</strong> ${{ github.ref_name }}<br>
            <strong>Java:</strong> ${{ matrix.java-version }}<br>
            <strong>Commit:</strong> <code>${{ github.sha }}</code></p>
            <p><strong>Test Summary:</strong> ${{ env.FAIL_SUMMARY }}</p>
            <p><strong>Test Results:</strong><br>${{ env.EMAIL_RESULTS }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Full Logs &amp; Screenshots</a></p>

      - name: Fail Job If Tests Failed
        if: always() && env.TEST_FAILED == 'true'
        run: |
          echo "One or more Selenium tests failed."
          exit 1
