name: Selenium CI Pipeline

on:
  push:
    branches: [ master ]
  repository_dispatch:
    types: [ newsletter-update ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # 🔥 prevents matrix cancellation
      matrix:
        java-version: [ '11', '17' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Install Dependencies
        run: mvn clean install -DskipTests

      # 🔑 Run tests and capture exit code
      - name: Run Selenium Tests
        id: selenium_tests
        continue-on-error: true
        run: |
          mvn test -B -V
          if [ $? -ne 0 ]; then
            echo "TEST_FAILED=true" >> $GITHUB_ENV
          else
            echo "TEST_FAILED=false" >> $GITHUB_ENV
          fi

      # 🔍 Check report directory
      - name: Check Test Reports
        id: check_reports
        continue-on-error: true
        run: |
          if [ -d target/surefire-reports ]; then
            echo "REPORTS_EXIST=true" >> $GITHUB_ENV
          else
            echo "REPORTS_EXIST=false" >> $GITHUB_ENV
          fi

      # 📦 Upload reports only if they exist
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-reports-java-${{ matrix.java-version }}
          path: target/surefire-reports
          retention-days: 30

      # 📋 Generate Test Summary
      - name: Generate Test Summary
        if: always()
        continue-on-error: true
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d target/surefire-reports ]; then
            echo "### Test Reports Generated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Reports Location:** \`target/surefire-reports/\`" >> $GITHUB_STEP_SUMMARY
            if [ -f target/surefire-reports/index.html ]; then
              echo "- HTML Report available" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Java Version:** ${{ matrix.java-version }}" >> $GITHUB_STEP_SUMMARY

      # 📸 Upload screenshots only if they exist
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: selenium-screenshots-java-${{ matrix.java-version }}
          path: |
            target/**/*.png
            screenshots/**/*.png
          retention-days: 30

      # 📊 Parse Test Results
      - name: Parse Test Results
        if: always()
        continue-on-error: true
        run: |
          if [ -d target/surefire-reports ]; then
            # Install xmlstarlet for better XML parsing
            sudo apt-get update -qq && sudo apt-get install -y -qq xmlstarlet > /dev/null 2>&1
            
            # Parse all test results
            RESULTS=""
            for xml_file in target/surefire-reports/TEST-*.xml; do
              if [ -f "$xml_file" ]; then
                # Extract test cases using xmlstarlet
                xmlstarlet sel -t \
                  -m "//testcase" \
                  -v "concat(@classname, '.', @name, '|', @time, '|')" \
                  -i "failure" -o "FAILED" -b \
                  -i "error" -o "ERROR" -b \
                  -i "not(failure) and not(error)" -o "PASSED" -b \
                  -n \
                  "$xml_file" 2>/dev/null | while IFS='|' read -r testname time status; do
                    # Extract just the method name
                    METHOD_NAME=$(echo "$testname" | sed 's/.*\.//')
                    TIME_ROUNDED=$(printf "%.1f" "$time")
                    
                    if [ "$status" = "PASSED" ]; then
                      echo "✅ $METHOD_NAME (${TIME_ROUNDED}s)"
                    else
                      echo "❌ $METHOD_NAME (${TIME_ROUNDED}s)"
                    fi
                  done
              fi
            done > /tmp/test_results.txt
            
            # Get the results (limit to 25 tests to avoid message size issues)
            RESULTS=$(cat /tmp/test_results.txt | head -25)
            TOTAL_COUNT=$(cat /tmp/test_results.txt | wc -l)
            
            if [ $TOTAL_COUNT -gt 25 ]; then
              RESULTS="$RESULTS"$'\n'"... and $((TOTAL_COUNT - 25)) more tests"
            fi
            
            # Count totals using xmlstarlet
            TOTAL=0
            FAILURES=0
            ERRORS=0
            for xml_file in target/surefire-reports/TEST-*.xml; do
              if [ -f "$xml_file" ]; then
                T=$(xmlstarlet sel -t -v "count(//testcase)" "$xml_file" 2>/dev/null || echo 0)
                F=$(xmlstarlet sel -t -v "count(//failure)" "$xml_file" 2>/dev/null || echo 0)
                E=$(xmlstarlet sel -t -v "count(//error)" "$xml_file" 2>/dev/null || echo 0)
                TOTAL=$((TOTAL + T))
                FAILURES=$((FAILURES + F))
                ERRORS=$((ERRORS + E))
              fi
            done
            PASSED=$((TOTAL - FAILURES - ERRORS))
            
            # Escape for JSON
            FORMATTED_RESULTS=$(echo "$RESULTS" | jq -Rs .)
            
            echo "TEST_RESULTS=$FORMATTED_RESULTS" >> $GITHUB_ENV
            echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV
            echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
            echo "FAILED_TESTS=$((FAILURES + ERRORS))" >> $GITHUB_ENV
          else
            echo "TEST_RESULTS=\"No test reports found\"" >> $GITHUB_ENV
            echo "TOTAL_TESTS=0" >> $GITHUB_ENV
            echo "PASSED_TESTS=0" >> $GITHUB_ENV
            echo "FAILED_TESTS=0" >> $GITHUB_ENV
          fi

      # ✅ Slack PASS
      - name: Slack Notification - Success
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-Type: application/json' \
          -d '{
            "text": "✅ Selenium Tests PASSED",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "✅ Selenium Tests PASSED"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Java:* ${{ matrix.java-version }}\n*Commit:* `${{ github.sha }}`"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Summary:* '"$PASSED_TESTS"'/'"$TOTAL_TESTS"' passed ✅"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Results:*\n```'"$(echo $TEST_RESULTS | jq -r .)"'```"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                }
              }
            ]
          }'

      # ❌ Slack FAIL
      - name: Slack Notification - Failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-Type: application/json' \
          -d '{
            "text": "❌ Selenium Tests FAILED",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "❌ Selenium Tests FAILED"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Java:* ${{ matrix.java-version }}\n*Commit:* `${{ github.sha }}`"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Summary:* '"$PASSED_TESTS"' passed, '"$FAILED_TESTS"' failed ('"$TOTAL_TESTS"' total) ⚠️"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Results:*\n```'"$(echo $TEST_RESULTS | jq -r .)"'```"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Full Logs & Screenshots>"
                }
              }
            ]
          }'